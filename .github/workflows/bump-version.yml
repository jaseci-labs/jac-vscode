name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (e.g., 2026.3.17)"
        type: string
        required: true

permissions: {}

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install jac
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/jaseci-labs/jac/main/scripts/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Bump version
        id: release
        env:
          BUMP_VERSION: ${{ inputs.version }}
        run: jac run scripts/bump_version.jac

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create branch and commit
        env:
          BRANCH_NAME: ${{ steps.release.outputs.branch_name }}
          PR_TITLE: ${{ steps.release.outputs.pr_title }}
        run: |
          git checkout -b "$BRANCH_NAME"
          git add jac.toml
          git commit -m "$PR_TITLE"
          git push origin "$BRANCH_NAME"

      - name: Create PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ steps.release.outputs.pr_title }}
          PR_BODY: ${{ steps.release.outputs.pr_body }}
          BRANCH_NAME: ${{ steps.release.outputs.branch_name }}
        run: |
          PR_URL=$(gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH_NAME")
          echo "::notice::Release PR created: $PR_URL"
