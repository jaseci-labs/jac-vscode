name: Release VSCE Extension

on:
  workflow_dispatch:

jobs:
  release-vsce:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install jac
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/jaseci-labs/jac/main/scripts/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # TEMPORARY until the next jac release (see test-vsce.yml).
      - name: Checkout jaclang main (dev compiler source)
        run: git clone --depth 1 https://github.com/jaseci-labs/jac ../jac

      - name: Build extension from Jac sources
        run: jac run scripts/build_ext.jac

      - name: Install vsce + ovsx
        run: npm install --global @vscode/vsce ovsx

      - name: Package Extension
        working-directory: .jac/vscode
        run: vsce package -o jac.vsix

      - name: Publish to VS Code Marketplace
        working-directory: .jac/vscode
        run: vsce publish --packagePath jac.vsix -p $VSCE_TOKEN
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}

      - name: Publish to OpenVSX
        working-directory: .jac/vscode
        run: ovsx publish jac.vsix --pat $OVSX_TOKEN
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}

      - name: Get Extension Version
        id: get_version
        run: |
          VERSION=$(grep -m1 '^version = ' jac.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with VSIX Asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.get_version.outputs.version }}" \
            .jac/vscode/jac.vsix \
            --title "${{ steps.get_version.outputs.version }}" \
            --generate-notes
